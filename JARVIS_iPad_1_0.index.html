<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050609"><title>JARVIS | Personal AI</title><style>*{box-sizing:border-box}body{margin:0;background:#050609;color:#f1e9e3;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}canvas{position:fixed;inset:0;touch-action:none}header{position:fixed;top:0;left:0;right:0;padding:22px 25px;display:flex;justify-content:space-between;pointer-events:none}h1{font-size:22px;letter-spacing:.36em;font-weight:500;margin:0;color:#ffae79}.sub{font-size:10px;letter-spacing:.18em;color:#b28e79;margin-top:6px}.status{font-size:11px;color:#ffbc91;text-align:right}footer{position:fixed;bottom:0;left:0;right:0;padding:18px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap;background:linear-gradient(transparent,#050609df)}button{border:1px solid #8b4934;background:#190e0d;color:#ffd2b6;border-radius:12px;padding:13px 16px;font-size:13px;cursor:pointer}button:active{background:#67321d}.panel{position:fixed;top:92px;left:18px;width:min(310px,calc(100% - 36px));background:#0b0d13cc;border:1px solid #4c2d27;border-radius:14px;padding:12px;backdrop-filter:blur(8px)}.panel small{color:#e0ad8b;line-height:1.5}#log{margin-top:8px;min-height:34px;color:#d7c6bb;font-size:12px}#cam{display:none;position:fixed;right:15px;top:90px;width:120px;border:1px solid #a75839;border-radius:10px;transform:scaleX(-1)}@media(max-width:600px){.panel{top:85px;width:245px}button{padding:12px;font-size:12px}header{padding:16px}}
</style></head><body><canvas id="fx"></canvas><header><div><h1>JARVIS</h1><div class="sub">PERSONAL AI · VERSION 1.0</div></div><div class="status" id="status">● TOUCH ONLINE<br>GESTEN BEREIT</div></header><div class="panel"><small>TIPPE ODER ZIEHE ÜBER DIE PARTIKEL.<br>AKTIVIERE OPTIONAL DIE KAMERA.</small><div id="log">System bereit. Willkommen zurück.</div></div><video id="cam" autoplay muted playsinline></video><footer><button id="camera">✋ Kamera aktivieren</button><button id="voice">🎙 Sprache</button><button id="ai">◉ Mein JARVIS</button><button id="mode">✦ Modus wechseln</button></footer><script>
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d'),log=document.getElementById('log'),status=document.getElementById('status');let W,H,dpr,particles=[],pointer={x:0,y:0,active:false},mode=0,handActive=false;const N=1050;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);build()}function build(){particles=[];let radius=Math.min(W*.31,H*.35,255);for(let i=0;i<N;i++){let a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*radius;particles.push({a,r,z:Math.random()*2-1,seed:Math.random()*100,speed:.001+Math.random()*.003,size:.7+Math.random()*1.7})}}addEventListener('resize',resize);resize();function locate(e){pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true}canvas.addEventListener('pointerdown',locate);canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')locate(e)});canvas.addEventListener('pointerup',()=>pointer.active=false);canvas.addEventListener('pointercancel',()=>pointer.active=false);let t=0;function frame(){t++;ctx.fillStyle='rgba(5,6,9,.31)';ctx.fillRect(0,0,W,H);const cx=W/2,cy=H/2+15;ctx.globalCompositeOperation='lighter';for(const p of particles){let a=p.a+t*p.speed;let r=p.r*(mode===1?.85:1);let x,y;if(mode===2){x=cx+Math.cos(a*2+p.z)*r;y=cy+Math.sin(a*3+p.z)*r*.72}else if(mode===1){x=cx+Math.cos(a)*r*1.25;y=cy+Math.sin(a)*r*.32+Math.sin(p.z*5+t*.012)*35}else{x=cx+Math.cos(a)*r;y=cy+Math.sin(a)*r*.92}let dx=x-pointer.x,dy=y-pointer.y,dist=Math.hypot(dx,dy);if(pointer.active&&dist<155){let f=(155-dist)/155;x+=dx/(dist||1)*f*95;y+=dy/(dist||1)*f*95}let alpha=.28+.65*(1-p.r/Math.min(W*.31,H*.35,255));ctx.beginPath();ctx.fillStyle=`rgba(255,${90+Math.floor(90*(1+p.z)/2)},${35+Math.floor(60*(1+p.z)/2)},${alpha})`;ctx.arc(x,y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalCompositeOperation='source-over';requestAnimationFrame(frame)}frame();document.getElementById('mode').onclick=()=>{mode=(mode+1)%3;log.textContent=['Partikelkugel aktiviert.','Ringmodus aktiviert.','Wirbelmodus aktiviert.'][mode]};document.getElementById('ai').onclick=()=>{log.textContent='Öffne deinen bestehenden JARVIS in ChatGPT.';window.open('https://chatgpt.com/','_blank')};document.getElementById('voice').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){log.textContent='Spracherkennung hier nicht verfügbar. Nutze den Sprachmodus in ChatGPT.';return}let rec=new SR();rec.lang='de-DE';rec.onresult=e=>{let s=e.results[0][0].transcript;log.textContent='Du: '+s;try{speechSynthesis.speak(new SpeechSynthesisUtterance('Befehl erkannt: '+s))}catch(_){}};rec.onerror=e=>log.textContent='Sprache: '+e.error;rec.start();log.textContent='Ich höre zu ...'};
let stream=null,tracker=null,looping=false;document.getElementById('camera').onclick=async()=>{if(stream){stream.getTracks().forEach(x=>x.stop());stream=null;document.getElementById('cam').style.display='none';pointer.active=false;status.innerHTML='● TOUCH ONLINE<br>KAMERA AUS';document.getElementById('camera').textContent='✋ Kamera aktivieren';return}try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Kamera benötigt HTTPS oder localhost.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});const video=document.getElementById('cam');video.srcObject=stream;video.style.display='block';await video.play();status.innerHTML='● TOUCH ONLINE<br>◉ KAMERA ONLINE';document.getElementById('camera').textContent='✕ Kamera stoppen';log.textContent='Kamera aktiv. Lade Handerkennung …';if(!window.Hands){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}tracker=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});tracker.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.55,minTrackingConfidence:.5});tracker.onResults(res=>{let h=res.multiHandLandmarks?.[0];if(h){let pt=h[8];pointer.x=(1-pt.x)*W;pointer.y=pt.y*H;pointer.active=true;handActive=true;log.textContent='Hand erkannt – Zeigefinger steuert Partikel.'}else if(handActive){pointer.active=false;handActive=false;log.textContent='Suche Hand vor der Kamera …'}});if(!looping){looping=true;const track=async()=>{if(!stream){looping=false;return}try{await tracker.send({image:video})}catch(e){log.textContent='Handtracking: '+e.message;looping=false;return}requestAnimationFrame(track)};track()}}catch(e){log.textContent='Kamera nicht verfügbar: '+e.message;if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}}};
</script></body></html>
